name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: lint, format, types, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-api.lock
            requirements-train.lock
            requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.lock -r requirements-dev.lock
          pip install -e . --no-deps

      - name: ruff (lint)
        run: ruff check .

      - name: black (format check)
        run: black --check .

      - name: mypy (strict)
        run: mypy

      - name: bandit (static security)
        run: bandit -c pyproject.toml -r src -ll

      - name: pip-audit (known vulnerabilities in locked deps)
        # Auditoria bloqueante das dependencias de runtime da API.
        run: |
          pip-audit -r requirements-api.lock --strict --desc on
          pip-audit -r requirements-app.lock --strict --desc on

  tests:
    name: pytest with coverage
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-api.lock
            requirements-train.lock
            requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.lock -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Generate synthetic fixture (versioned generator)
        run: python scripts/make_synthetic_fixture.py

      - name: Data quality gate (synthetic fixture)
        run: python -m src.data.quality --fixture --report evidencias/data_quality_fixture.json

      - name: Data quality gate (frozen PNS 2013 extract, blocking)
        # Verifica SHA-256, dimensoes, contagens dos filtros populacionais e a
        # faixa de nulos e o dominio de cada uma das 61 variaveis brutas.
        run: python -m src.data.quality --report evidencias/data_quality_real.json

      - name: pytest with coverage gate (fail_under = 80, from pyproject)
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Drift scenarios offline (baseline must be clean, simulated must alert)
        run: |
          python scripts/baseline_scenario.py --fixture
          python scripts/simulate_drift.py --fixture

      - name: Export coverage summary to evidencias/
        run: coverage report -m > evidencias/coverage_summary.txt

      - name: Upload coverage and quality reports
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            evidencias/coverage.xml
            evidencias/coverage_summary.txt
            evidencias/data_quality_fixture.json
            evidencias/data_quality_real.json
          if-no-files-found: error

  train:
    name: experiments (MLflow, all runs)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-api.lock
            requirements-train.lock
            requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.lock -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Run every configured experiment and promote the champion
        # Dez runs (LR fidelity/production/smoking-fixed/baseline, RF, XGBoost,
        # LightGBM, MLP, CatBoost, SVM) no MLflow com backend SQLite. O golden
        # (evidencias/golden_metrics.json) e versionado e NAO e reescrito aqui (P4).
        run: python -m src.models.train --all --backend mlflow

      - name: Metric regression against golden values
        run: pytest tests/integration/test_metric_regression.py -q

      - name: Upload MLflow store and evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-and-evidence
          path: |
            mlruns/mlflow.db
            evidencias/experiments.md
            evidencias/experiments.json
            evidencias/fidelity_vs_production.md
            evidencias/subgroup_metrics_lr_production.csv
            evidencias/roc_holdout.png
            evidencias/confusion_matrix_lr_production.png
          if-no-files-found: error

  docker:
    name: build API image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (multi-stage, requirements-api.lock only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          load: true
          tags: hypertension-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image (imports, non-root user, no training libraries)
        run: |
          docker run --rm hypertension-api:ci python -c "import src.api.main; print('api importable')"
          docker run --rm hypertension-api:ci id -u | grep -qv '^0$'
          docker run --rm hypertension-api:ci python -c "import importlib,sys; sys.exit(0 if all(importlib.util.find_spec(m) is None for m in ['catboost','lightgbm','xgboost','boruta','optuna','shap','seaborn']) else 1)"

      - name: Build interface image (requirements-app.lock only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          push: false
          load: true
          tags: hypertension-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the interface image (client only, no model libraries)
        run: |
          docker run --rm hypertension-app:ci python -c "import streamlit, src.app.client, src.app.form_spec; print('app importable')"
          docker run --rm hypertension-app:ci id -u | grep -qv '^0$'
          docker run --rm hypertension-app:ci python -c "import importlib,sys; sys.exit(0 if all(importlib.util.find_spec(m) is None for m in ['sklearn','mlflow','prometheus_client','fastapi']) else 1)"

      - name: Build training image (requirements-train.lock + dev)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.train
          push: false
          load: true
          tags: hypertension-train:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the training image (whole pipeline runs inside the container)
        # Prova o caminho "so Docker" do README: sem Python no host, o repositorio
        # montado em /app roda o gate de qualidade e os testes.
        run: |
          docker run --rm -v "$PWD:/app" hypertension-train:ci python -c "import sklearn, mlflow, streamlit, xgboost, lightgbm, catboost; print('treino importavel')"
          docker run --rm -v "$PWD:/app" hypertension-train:ci python -m src.data.quality --fixture
          docker run --rm -v "$PWD:/app" hypertension-train:ci pytest -q tests/unit -x

      - name: Save image as artifact
        run: docker save hypertension-api:ci | gzip > hypertension-api-ci.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: hypertension-api-image
          path: hypertension-api-ci.tar.gz

  stack:
    name: compose stack, online drift and load test
    runs-on: ubuntu-latest
    needs: [tests, docker]
    env:
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-api.lock
            requirements-train.lock
            requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.lock -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Train and register the champion locally (artifacts/lr_production + drift reference)
        run: python -m src.models.train --run lr_production --backend json

      - name: Start the stack (API, interface, Prometheus, Grafana)
        run: |
          docker compose -f docker/docker-compose.yml up --build -d api app prometheus grafana

      - name: Wait for every service
        run: |
          for i in $(seq 1 40); do curl -fsS "$API_URL/health" && break; sleep 3; done
          curl -fsS "$API_URL/health" | tee evidencias/compose_health.json
          for i in $(seq 1 40); do curl -fsS http://localhost:8501/_stcore/health && break; sleep 3; done
          for i in $(seq 1 20); do curl -fsS http://localhost:9090/-/ready && break; sleep 3; done
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/api/health && break; sleep 3; done

      - name: Retraining flag is decidable (informative)
        run: |
          # The flag must be computable and must report its reason; it never trains here.
          curl -fsS "$API_URL/metrics" | grep -E "^retraining_recommended " \
            | tee evidencias/retraining_gauge_ci.txt

      - name: Global model report is served (gate)
        run: |
          # The model page of the interface is a pure HTTP client: if one of these five
          # sections stops answering, that page silently stops drawing.
          for section in summary roc importance contributions subgroups; do
            curl -fsS "$API_URL/model/$section" \
              | python -c "import json,sys; b=json.load(sys.stdin); assert b['available'], b.get('reason'); print('$section ok')"
          done
          curl -fsS "$API_URL/model/summary" > evidencias/model_summary_ci.json

      - name: Online drift scenarios through the API (gate)
        # Baseline first (window holds only baseline rows), then the simulated shift.
        run: |
          python scripts/baseline_scenario.py --no-materialize --api-url "$API_URL"
          python scripts/simulate_drift.py --no-materialize --api-url "$API_URL"

      - name: Load test against the container (p95, throughput, CPU, memory)
        # Informativo no runner compartilhado (2 vCPU, gerador de carga na mesma
        # maquina); a evidencia oficial do gate p95 e a execucao local documentada.
        continue-on-error: true
        run: python scripts/load_test.py --url "$API_URL" --container hypertension-mlops-api-1 --name load_test_ci

      - name: Prometheus scrapes the API and Grafana provisioned the dashboard
        run: |
          sleep 20
          curl -fsS http://localhost:9090/api/v1/targets | python -c "import json,sys; t=json.load(sys.stdin)['data']['activeTargets']; assert any(x['health']=='up' for x in t), t; print('prometheus target up')"
          curl -fsS -u "admin:admin" http://localhost:3000/api/dashboards/uid/hypertension-api | python -c "import json,sys; d=json.load(sys.stdin)['dashboard']; print('grafana dashboard:', d['title'], len(d['panels']), 'panels')" | tee evidencias/grafana_dashboard_check.txt
          curl -fsS "$API_URL/metrics" > evidencias/metrics_exposition_ci.txt

      - name: Collect logs and stop the stack
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml logs api > evidencias/compose_api_ci.log 2>&1 || true
          docker compose -f docker/docker-compose.yml down -v

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-evidence
          path: |
            evidencias/compose_health.json
            evidencias/model_summary_ci.json
            evidencias/retraining_gauge_ci.txt
            evidencias/drift_baseline.json
            evidencias/drift_baseline.md
            evidencias/drift_simulated.json
            evidencias/drift_simulated.md
            evidencias/load_test_ci.json
            evidencias/load_test_ci.md
            evidencias/grafana_dashboard_check.txt
            evidencias/metrics_exposition_ci.txt
            evidencias/compose_api_ci.log
          if-no-files-found: warn
