# Gerado a partir das tabelas 3.3 e 3.4 do inventario (docs/00_inventario_artefatos_originais.md).
# Regras: 'en' e o unico nome usado em src/; 'pt' e o nome do funcoes_mecai_v3.py; 'pns' e o codigo do IBGE.
# null_share_max alimenta o gate de qualidade de dados (observado + 0,10; zero quando a variavel nunca e nula).
# value_labels_pt: rotulos dos codigos conforme o dicionario da PNS 2013 (uso exclusivo da interface).
version: 2
description: Mapa explicito PNS 2013 -> nome do .py original (pt) -> nome no codigo (en). Fonte unica de nomes,
  dominios e categorias. Nenhuma traducao implicita no codigo.
auxiliary_variables:
- pns: Z051
  pt: questionario
  en: lab_consent
  role: filter
  domain:
    type: categorical
    values: [1, 2, 3]
- pns: P005
