# Prometheus raspa a API a cada 15 s. O alvo e o nome do servico na rede do compose.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: hypertension-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: hypertension-api
